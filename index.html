<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  document.documentElement.style.scrollBehavior = 'auto';

  [0, 16, 50, 120, 300, 700, 1500].forEach(t => setTimeout(toTop, t));

<link rel="preconnect" href="https://fonts.googleapis.com">

    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:hidden}

<canvas id="canvas"></canvas>

<div id="vignette"></div>
<div id="scroll"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';

const clock = new THREE.Clock();

const lerp = (a,b,t)=>a+(b-a)*t;
const smoothstep = (a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
const rand = (a,b)=>a+Math.random()*(b-a);

const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x000000, 0.0075);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 900);

let scrollProgress = 0;
let scrollSmooth   = 0;
let heat = 1.0;
function readScroll(){
  const max = document.documentElement.scrollHeight - innerHeight;
  scrollProgress = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}
addEventListener('scroll', readScroll, {passive:true});
readScroll();

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  uniforms:{uTime:{value:0}, uHeat:{value:1.0}},
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    varying vec3 vP; uniform float uTime; uniform float uHeat;
    float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
    float noise(vec3 p){
      vec3 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
      float n000=hash(i),n100=hash(i+vec3(1,0,0)),n010=hash(i+vec3(0,1,0)),
            n110=hash(i+vec3(1,1,0)),n001=hash(i+vec3(0,0,1)),n101=hash(i+vec3(1,0,1)),
            n011=hash(i+vec3(0,1,1)),n111=hash(i+vec3(1,1,1));
      return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
                 mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
    }
    void main(){
      vec3 d = normalize(vP);
      float n = noise(d*2.5 + vec3(uTime*0.015));
      n = pow(n, 1.6);
      vec3 base = vec3(0.004,0.006,0.018);
      vec3 warm = vec3(0.09,0.035,0.055) * uHeat;
      vec3 cool = vec3(0.02,0.04,0.11) * (0.4 + 0.6*uHeat);
      vec3 col  = base + mix(cool, warm, n)*n*0.9;
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 48, 32), skyMat));

function makeStars(count, rMin, rMax, sizeMul){
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(count*3), s = new Float32Array(count),
        ph = new Float32Array(count), rl = new Float32Array(count);
  for (let i=0;i<count;i++){
    const r = rand(rMin, rMax);
    const th = Math.random()*Math.PI*2, ph2 = Math.acos(2*Math.random()-1);
    p[i*3]   = r*Math.sin(ph2)*Math.cos(th);
    p[i*3+1] = r*Math.sin(ph2)*Math.sin(th);
    p[i*3+2] = r*Math.cos(ph2);
    s[i]  = (0.4 + Math.random()*1.4) * sizeMul;
    ph[i] = Math.random()*Math.PI*2;
    rl[i] = Math.random();
  }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(s,1));
  g.setAttribute('aPhase',   new THREE.BufferAttribute(ph,1));
  g.setAttribute('aReact',   new THREE.BufferAttribute(rl,1));
  return g;
}

const starMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{
    uTime:{value:0},
    uPR:{value:Math.min(devicePixelRatio,2)},
    uHeat:{value:1.0},
  },
  vertexShader:`
    uniform float uTime, uPR, uHeat;
    attribute float aSize, aPhase, aReact;
    varying float vTw;
    void main(){
      vec3 p = position;
      p.x += sin(uTime*0.05 + aPhase)*0.3;
      p.y += cos(uTime*0.07 + aPhase*1.7)*0.3;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_Position = projectionMatrix * mv;
      float tw = 0.5 + 0.5*sin(uTime*1.4 + aPhase*20.0);
      gl_PointSize = aSize * uPR * (340.0 / max(-mv.z,0.001))
                   * (0.55 + 0.45*tw);
      vTw = tw;
    }`,
  fragmentShader:`
    varying float vTw;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float a = smoothstep(0.5, 0.0, length(uv));
      a = pow(a, 2.0);
      float bright = a * vTw;
      gl_FragColor = vec4(vec3(1.0), bright);
    }`
});
const starsFar  = new THREE.Points(makeStars(2600, 180, 480, 1.0), starMat);
const starsNear = new THREE.Points(makeStars(1400,  90, 200, 0.7), starMat);
scene.add(starsFar);
scene.add(starsNear);

const CLUSTERS = [
  new THREE.Vector3(-14,  2,  -8),
  new THREE.Vector3( 12,  6, -18),
  new THREE.Vector3(  0, -7,   6),
  new THREE.Vector3( 22, -3,  12),
  new THREE.Vector3(-20,  8,  14),
  new THREE.Vector3(  5, 12, -25),
];
const DUST_N = 18000;
const dustGeo = new THREE.BufferGeometry();
{
  const seed=new Float32Array(DUST_N*3), center=new Float32Array(DUST_N*3),
        off=new Float32Array(DUST_N), size=new Float32Array(DUST_N), phase=new Float32Array(DUST_N);
  for (let i=0;i<DUST_N;i++){
    const r = rand(30, 105);
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    seed[i*3]   = r*Math.sin(ph)*Math.cos(th);
    seed[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.62;
    seed[i*3+2] = r*Math.cos(ph);
    const c = CLUSTERS[(Math.random()*CLUSTERS.length)|0];
    const j = 1.4;
    center[i*3]   = c.x + (Math.random()-0.5)*j;
    center[i*3+1] = c.y + (Math.random()-0.5)*j;
    center[i*3+2] = c.z + (Math.random()-0.5)*j;
    off[i]   = Math.random()*0.5;
    size[i]  = 0.35 + Math.random()*1.25;
    phase[i] = Math.random()*Math.PI*2;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(seed,3));
  dustGeo.setAttribute('aCenter',  new THREE.BufferAttribute(center,3));
  dustGeo.setAttribute('aOffset',  new THREE.BufferAttribute(off,1));
  dustGeo.setAttribute('aSize',    new THREE.BufferAttribute(size,1));
  dustGeo.setAttribute('aPhase',   new THREE.BufferAttribute(phase,1));
}
const dustMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{
    uTime:{value:0}, uGather:{value:0},
    uPR:{value:Math.min(devicePixelRatio,2)},
    uHeat:{value:1.0},
    uColorA:{value:new THREE.Color(0.65,0.78,1.0)},
    uColorB:{value:new THREE.Color(1.0,0.72,0.42)},
    uColorC:{value:new THREE.Color(1.0,0.28,0.10)},
  },
  vertexShader:`
    uniform float uTime, uGather, uPR, uHeat;
    attribute vec3 aCenter;
    attribute float aOffset, aSize, aPhase;
    varying float vA; varying float vMix; varying float vHeat;
    void main(){
      float localG = smoothstep(aOffset, aOffset + 0.45, uGather);
      float driftAmp = 1.6 + (1.0 - uHeat) * 2.8;
      vec3 drift = vec3(
        sin(uTime*0.15 + aPhase + position.x*0.05),
        cos(uTime*0.13 + aPhase*1.2 + position.y*0.05),
        sin(uTime*0.11 + aPhase*1.7 + position.z*0.05)
      ) * driftAmp;
      vec3 turb = vec3(
        sin(uTime*0.05 + position.y*0.03 + aPhase),
        cos(uTime*0.04 + position.z*0.03 + aPhase*1.3),
        sin(uTime*0.06 + position.x*0.03 + aPhase*0.7)
      ) * (1.0 + (1.0 - uHeat) * 1.5);
      vec3 p = mix(position + drift + turb, aCenter + position*0.018, localG);
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPR * (210.0 / max(-mv.z,0.001))
                   * (0.35 + localG*1.35)
                   * (1.0 + (1.0 - uHeat) * 0.35);
      vA = (0.22 + localG*0.95) * (0.55 + 0.65*uHeat);
      vMix = localG; vHeat = uHeat;
    }`,
  fragmentShader:`
    uniform vec3 uColorA, uColorB, uColorC;
    varying float vA; varying float vMix; varying float vHeat;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float a = smoothstep(0.5,0.0,length(uv));
      a = pow(a, 2.0);
      vec3 hotCol  = mix(uColorB, uColorC, vMix * 0.6);
      vec3 coolCol = uColorA;
      vec3 col = mix(coolCol, hotCol, vHeat);
      gl_FragColor = vec4(col, a*vA);
    }`
});
scene.add(new THREE.Points(dustGeo, dustMat));

scene.add(new THREE.AmbientLight(0x0a0c18, 1.0));
const keyL = new THREE.DirectionalLight(0xfff3e0, 1.6); keyL.position.set(30, 40, 25); scene.add(keyL);
const rimL = new THREE.PointLight(0x4466ff, 3.0, 90);   rimL.position.set(-30,-14,-25); scene.add(rimL);
const wrL  = new THREE.PointLight(0xff8844, 2.0, 55);   wrL.position.set(16, 18, 14);  scene.add(wrL);

function radialTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0.0,'rgba(255,255,255,1)');
  g.addColorStop(0.15,'rgba(255,230,200,0.9)');
  g.addColorStop(0.4,'rgba(255,150,80,0.4)');
  g.addColorStop(1.0,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const flashTex = radialTex();
const flashes = [];
for (let i=0;i<10;i++){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map:flashTex, color:0xffffff, blending:THREE.AdditiveBlending,
    transparent:true, depthWrite:false, opacity:0
  }));
  sp.scale.setScalar(0.001);
  scene.add(sp);
  flashes.push({sprite:sp, life:0, active:false});
}
const flashEvents = [
  {t:0.28,c:0},{t:0.335,c:2},{t:0.395,c:1},{t:0.44,c:3},
  {t:0.485,c:4},{t:0.545,c:5},{t:0.615,c:0},{t:0.665,c:3},
];
let shakeAmount = 0;
function spawnFlash(cx, cy, cz, power=1.0){
  const f = flashes.find(x=>!x.active) || flashes[0];
  f.active = true; f.life = 1.0;
  f.sprite.position.set(cx, cy, cz);
  f.sprite.material.opacity = 1.0;
  f.sprite.scale.setScalar(3 * power);
  shakeAmount = Math.max(shakeAmount, 0.55 * power);
}

const camKeys = [
  { t:0.00, p:[   0,  0, 160], look:[  0, 0,   0], fov:40 },
  { t:0.10, p:[   0,  5, 120], look:[  0, 0,   0], fov:44 },
  { t:0.22, p:[   6,  8,  80], look:[  0, 0,   0], fov:50 },
  { t:0.35, p:[  -8,  6,  40], look:[-14, 2,  -8], fov:55 },
  { t:0.48, p:[   8, -4,  30], look:[ 12, 6, -18], fov:58 },
  { t:0.60, p:[ -10,  4,  24], look:[-20, 8,  14], fov:60 },
  { t:0.72, p:[   0, 10,  45], look:[  0, 0,   0], fov:54 },
  { t:0.85, p:[   0,  3,  80], look:[  0, 0,   0], fov:48 },
  { t:1.00, p:[   0,  0, 150], look:[  0, 0,   0], fov:42 },
];
function evalCam(t){
  let a = camKeys[0], b = camKeys[camKeys.length-1];
  for (let i=0;i<camKeys.length-1;i++){
    if (t >= camKeys[i].t && t <= camKeys[i+1].t){ a=camKeys[i]; b=camKeys[i+1]; break; }
  }
  const span = (b.t - a.t) || 1;
  const k = smoothstep(0,1,(t - a.t)/span);
  return {
    p:[lerp(a.p[0],b.p[0],k),lerp(a.p[1],b.p[1],k),lerp(a.p[2],b.p[2],k)],
    look:[lerp(a.look[0],b.look[0],k),lerp(a.look[1],b.look[1],k),lerp(a.look[2],b.look[2],k)],
    fov:lerp(a.fov,b.fov,k),
  };
}
function gatherAt(t){
  const p1 = Math.exp(-Math.pow((t-0.30)/0.15, 2));
  const p2 = Math.exp(-Math.pow((t-0.65)/0.13, 2));
  return Math.min(1, p1*0.9 + p2*1.05);
}

const composer = new EffectComposer(renderer);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.75, 0.22);
composer.addPass(bloom);
const afterimage = new AfterimagePass(0.72);
composer.addPass(afterimage);
const grainPass = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uAmount:{value:0.075}, uVig:{value:1.15}, uHeat:{value:1.0} },
  vertexShader:`varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime, uAmount, uVig, uHeat;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec4 col = texture2D(tDiffuse, vUv);
      float g = hash(vUv*vec2(900.0, 700.0) + uTime);
      col.rgb += (g - 0.5) * uAmount * (0.6 + 0.8*uHeat);
      vec2 uv = vUv - 0.5;
      float v = smoothstep(0.95, 0.30, length(uv) * uVig * 1.55);
      col.rgb *= v;
      vec3 cold = vec3(0.75, 0.85, 1.05);
      vec3 warm = vec3(1.05, 1.0, 0.95);
      col.rgb *= mix(cold, warm, uHeat);
      gl_FragColor = col;
    }`
});
composer.addPass(grainPass);

const glitchCanvas = document.getElementById('glitch');
const gctx = glitchCanvas.getContext('2d');
function glitchResize(){
  glitchCanvas.width  = Math.round(innerWidth);
  glitchCanvas.height = Math.round(innerHeight);
}
glitchResize();
gctx.clearRect(0, 0, glitchCanvas.width, glitchCanvas.height);

let glitchUntil = 0;
function glitchStart(durSec = 1.6){
  glitchUntil = performance.now() + durSec * 1000;
  glitchCanvas.classList.add('on');
}
function glitchRender(now){
  if (glitchUntil === 0) return;
  if (now >= glitchUntil){
    glitchCanvas.classList.remove('on');
    gctx.clearRect(0, 0, glitchCanvas.width, glitchCanvas.height);
    glitchUntil = 0;
    return;
  }
  const w = glitchCanvas.width, h = glitchCanvas.height;
  const img = gctx.createImageData(w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const v = Math.random() * 255;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 40 + Math.random() * 120;
  }
  gctx.putImageData(img, 0, 0);
  gctx.globalCompositeOperation = 'multiply';
  gctx.fillStyle = 'rgba(0,0,0,0.4)';
  for (let y = 0; y < h; y += 3) gctx.fillRect(0, y, w, 1);
  gctx.globalCompositeOperation = 'screen';
  for (let b = 0; b < 5; b++){
    const y = Math.random() * h;
    const bh = 2 + Math.random() * 12;
    gctx.fillStyle = Math.random() < 0.5
      ? 'rgba(80,180,255,0.40)'
      : 'rgba(255,80,120,0.35)';
    gctx.fillRect(0, y, w, bh);
  }
  gctx.globalCompositeOperation = 'source-over';
}

const NEXT_FILE = 'worldB.html';
const TRIGGER_ON = 0.995;
let triggered = false;
let transitioning = false;

function goToNext(){
  if (transitioning) return;
  transitioning = true;
  glitchStart(1.6);
  setTimeout(()=>{
    location.href = NEXT_FILE;
  }, 1600);
}

let lastProgress = 0;
let lastFrameTime = performance.now();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  readScroll();

  const followSoft = 1 - Math.pow(0.22, dt);
  scrollSmooth += (scrollProgress - scrollSmooth) * followSoft;
  if (Math.abs(scrollProgress - scrollSmooth) < 0.00005){
    scrollSmooth = scrollProgress;
  }

  const prevProgress = lastProgress;

  const progressing = Math.abs(scrollSmooth - lastProgress) > 0.0002;
  if (progressing) heat = Math.min(1.0, heat + dt * 0.55);
  else             heat = Math.max(0.0, heat - dt * 0.18);
  const heatFromProgress = 1.0 - smoothstep(0.55, 1.0, scrollSmooth) * 0.85;
  const h = Math.min(heat, heatFromProgress);

  const cam = evalCam(scrollSmooth);

  const lt = t * 0.08;
  const droneX = Math.sin(lt * 1.00) * 2.0 + Math.sin(lt * 2.71) * 0.55;
  const droneY = Math.cos(lt * 0.83) * 1.4 + Math.sin(lt * 3.13) * 0.35;
  const droneZ = Math.sin(lt * 0.61) * 2.2;
  const lookDX = Math.sin(lt * 0.72) * 0.9;
  const lookDY = Math.cos(lt * 0.91) * 0.6;
  const lookDZ = Math.sin(lt * 0.55) * 0.5;

  camera.position.set(
    cam.p[0] + droneX + (Math.random()-0.5)*shakeAmount,
    cam.p[1] + droneY + (Math.random()-0.5)*shakeAmount,
    cam.p[2] + droneZ + (Math.random()-0.5)*shakeAmount
  );
  camera.lookAt(
    cam.look[0] + lookDX,
    cam.look[1] + lookDY,
    cam.look[2] + lookDZ
  );

  const breath = 1
    + Math.sin(t * 0.35) * 0.012
    + Math.sin(t * 0.13) * 0.008;
  camera.fov = cam.fov * breath;
  camera.updateProjectionMatrix();
  shakeAmount *= 0.88;

  starMat.uniforms.uTime.value     = t;
  starMat.uniforms.uHeat.value     = h;
  skyMat.uniforms.uTime.value      = t;
  skyMat.uniforms.uHeat.value      = h;
  dustMat.uniforms.uTime.value     = t;
  dustMat.uniforms.uHeat.value     = h;
  const g = gatherAt(scrollSmooth);
  dustMat.uniforms.uGather.value = g;
  grainPass.uniforms.uTime.value = t;
  grainPass.uniforms.uHeat.value = h;

  bloom.strength = 0.35 + 0.9 * g * (0.35 + 0.65*h);
  afterimage.uniforms.damp.value = (0.55 + 0.20 * Math.sin(scrollSmooth*Math.PI)) * (0.55 + 0.55*h);
  renderer.toneMappingExposure = 0.85 + 0.35 * h;

  flashes.forEach(f=>{
    if (!f.active) return;
    f.life -= 0.022;
    if (f.life <= 0){ f.active=false; f.sprite.material.opacity=0; f.sprite.scale.setScalar(0.001); return; }
    f.sprite.material.opacity = Math.pow(f.life, 1.6) * (0.3 + 0.7*h);
    f.sprite.scale.setScalar(3 + (1 - f.life) * 22);
  });
  for (const e of flashEvents){
    const crossing = (prevProgress < e.t && scrollSmooth >= e.t) ||
                     (prevProgress > e.t && scrollSmooth <= e.t);
    if (crossing){
      const c = CLUSTERS[e.c];
      spawnFlash(c.x, c.y, c.z, 1.0);
    }
  }

  if (!triggered && scrollProgress >= TRIGGER_ON){
    triggered = true;
    goToNext();
  }

  glitchRender(now);
  lastProgress = scrollSmooth;
  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
  const pr = Math.min(devicePixelRatio, 2);
  starMat.uniforms.uPR.value = pr;
  dustMat.uniforms.uPR.value = pr;
  readScroll();
  glitchResize();
});
</script>
</body>
